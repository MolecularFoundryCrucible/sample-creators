{% extends "base.html" %}
{% block title %}Synthesis Upload{% endblock %}

{% block content %}
<h1>Synthesis Upload</h1>

<!-- The grid needs the full width, so the login panel sits above it. -->
<div class="synthesis-login">
        <!-- User Login -->
        <section class="section" id="section-login">
            <h2>User Login</h2>
            <div class="form-group">
                <label>Email or username</label>
                <form class="input-row" onsubmit="loginUser(event)">
                    <input type="text" id="email" placeholder="user-email@lbl.gov or username" autocomplete="username">
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
            </div>
            <div class="form-group">
                <label>User</label>
                <input type="text" id="username" readonly>
            </div>
            <div class="form-group">
                <label>Project</label>
                <select id="project" onchange="setProject()"></select>
            </div>
            <button class="btn btn-secondary" onclick="logoutUser()">Logout</button>
        </section>
</div>

<div id="synthesis-root" class="ms-island"></div>
{% endblock %}

{% block scripts %}
{{ vite_entry('synthesis') }}
<script>document.addEventListener('DOMContentLoaded', () => loadUserState());</script>
{% endblock %}
