<div class="left-panel">

    <!-- User Login -->
    <section class="section" id="section-login">
        <h2>User Login</h2>
        <div class="form-group">
            <label>Email or username</label>
            <form class="input-row" onsubmit="loginUser(event)">
                <input type="text" id="email" placeholder="user-email@lbl.gov or username" autocomplete="username">
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>
        <div class="form-group">
            <label>User</label>
            <input type="text" id="username" readonly>
        </div>
        <div class="form-group">
            <label>Project</label>
            <select id="project" onchange="setProject()"></select>
        </div>
        <button class="btn btn-secondary" onclick="logoutUser()">Logout</button>
    </section>

    <!-- Sample Lookup / Creation -->
    <section class="section" id="section-sample">
        <h2>Sample (Optional)</h2>
        <div class="subsection-header">Search</div>
        <div class="form-group">
            <label>Barcode or Sample Name</label>
            <div class="input-row">
                <input type="text" id="sample_barcode" placeholder="Scan MFID or enter sample name">
                <button class="btn btn-primary" onclick="lookupSample()">Lookup</button>
                <button class="btn btn-secondary" onclick="clearSample()">Clear</button>
            </div>
        </div>
        <div class="form-group">
            <label>Printer</label>
            <select id="printer-select"></select>
        </div>
        <div class="button-row" style="margin-top: 6px;">
            <button class="btn" onclick="printSampleBarcode()">Print Barcode</button>
        </div>
        <div id="sample-status" class="info-text" style="margin-top: 6px;"></div>

        <div id="sample-detail-panel" class="hidden">
            <div class="subsection-divider"></div>
            <div id="sample-panel-header" class="subsection-header">Sample Details</div>
            <div class="form-group">
                <label>Sample Name</label>
                <input type="text" id="sample_name" placeholder="e.g. sample_1">
                <span id="sample_name_text" class="field-text hidden"></span>
            </div>
            <div class="form-group">
                <label>Sample Type</label>
                <div class="typeahead">
                    <input type="text" id="sample_type" placeholder="e.g. thin_film" autocomplete="off">
                    <div id="sample_type_results" class="typeahead-results hidden"></div>
                </div>
                <span id="sample_type_text" class="field-text hidden"></span>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="sample_description" placeholder="Optional description">
                <span id="sample_description_text" class="field-text hidden"></span>
            </div>
            <div class="button-row hidden" id="create-btn-row">
                <button class="btn btn-primary" id="btn-create-sample" onclick="createSample()">Create Sample</button>
            </div>
        </div>
    </section>

</div>
