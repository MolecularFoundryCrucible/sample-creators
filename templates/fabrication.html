{% extends "base.html" %}
{% block title %}Fabrication Traveler{% endblock %}

{% block content %}
<h1>Fabrication Traveler</h1>

<!-- The step tables need the full width, so the login panel sits above them. -->
<div class="synthesis-login">
        <!-- User Login -->
        <section class="section" id="section-login">
            <h2>User Login</h2>
            <div class="form-group">
                <label>Email or username</label>
                <form class="input-row" onsubmit="loginUser(event)">
                    <input type="text" id="email" placeholder="user-email@lbl.gov or username" autocomplete="username">
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
            </div>
            <div class="form-group">
                <label>User</label>
                <input type="text" id="username" readonly>
            </div>
            <div class="form-group">
                <label>Project</label>
                <select id="project" onchange="setProject()"></select>
            </div>
            <button class="btn btn-secondary" onclick="logoutUser()">Logout</button>
        </section>
</div>

<div id="traveler-root" class="ms-island" data-wafer-id="{{ wafer_id or '' }}" data-mask-id="{{ mask_id or '' }}"
         data-initial-view="{{ 'masks' if mask_id is defined else 'wafers' }}"></div>
{% endblock %}

{% block scripts %}
{{ vite_entry('traveler') }}
<script>document.addEventListener('DOMContentLoaded', () => loadUserState());</script>
{% endblock %}
